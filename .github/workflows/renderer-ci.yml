name: Rust renderer prototype

on:
  pull_request:
  push:
    branches:
      - main
      - feat/rust-renderer-prototype

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format sources for test build
        run: cargo fmt --all
      - name: Native unit tests
        run: cargo test --all-targets
      - name: WASM compile
        run: cargo build --release --target wasm32-unknown-unknown
      - name: Upload runnable WASM
        uses: actions/upload-artifact@v4
        with:
          name: smarttvkit-web-wasm
          path: target/wasm32-unknown-unknown/release/smarttvkit_demo.wasm
          if-no-files-found: error
